<!doctype html><html lang="en"><meta charset="utf-8"><title>Local face evaluation labels</title>
<style>body{font:16px system-ui;max-width:1050px;margin:30px auto;background:#101724;color:#eef}button,input,select{font:inherit;margin:6px;padding:8px}canvas{max-width:100%;border:1px solid #abc;touch-action:none}video{max-width:100%;max-height:260px}p{line-height:1.5}</style>
<h1>Label evaluation clips locally</h1><p>Open a clip, choose session and split, seek to a frame, then draw every visible face box on the image. Save empty frames explicitly when no face is visible. Nothing is uploaded.</p>
<label>Resume manifest <input id="manifest" type="file" accept=".json"></label><br>
<label>Video <input id="file" type="file" accept="video/*"></label><br>
<label>Session <input id="session" value="evening-01"></label>
<label>Split <select id="split"><option>enrollment</option><option>calibration</option><option>test</option></select></label><br>
<video id="video" controls muted></video><br>
<label>Seconds <input id="time" type="number" min="0" step="1" value="0"></label><button id="seek">Load frame</button>
<label>Draw label <select id="identity"><option>jaitra</option><option>other</option></select></label>
<button id="undo">Undo box</button><button id="save">Save this labelled frame</button><button id="export">Save manifest</button>
<p id="status" role="status"></p><canvas id="canvas"></canvas>
<script>
const $ = id => document.getElementById(id);
const video = $('video'), canvas = $('canvas'), ctx = canvas.getContext('2d');
let data={clips:[]}, file=null, url=null, boxes=[], start=null, frameTime=null;
function status(text){$('status').textContent=text;}
function draw(){if(frameTime===null)return;ctx.drawImage(video,0,0,canvas.width,canvas.height);for(const face of boxes){const b=face.box;ctx.strokeStyle=face.label==='jaitra'?'#40ef8a':'#ffc457';ctx.lineWidth=3;ctx.strokeRect(b.x*canvas.width,b.y*canvas.height,b.width*canvas.width,b.height*canvas.height);ctx.fillStyle=ctx.strokeStyle;ctx.font='18px sans-serif';ctx.fillText(face.label,b.x*canvas.width,b.y*canvas.height+18);}}
$('manifest').onchange=async e=>{try{data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.clips))throw Error('Missing clips');status(`Loaded ${data.clips.length} clips`);}catch(err){data={clips:[]};status(String(err));}};
$('file').onchange=e=>{file=e.target.files[0];if(!file)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(file);video.src=url;frameTime=null;boxes=[];const clip=data.clips.find(c=>c.id===file.name.replace(/\.[^.]+$/,''));if(clip){$('session').value=clip.session;$('split').value=clip.split;}status('Choose a time and load frame.');};
$('seek').onclick=()=>{if(!file)return;video.pause();frameTime=null;video.currentTime=Number($('time').value)+.001;};
video.onseeked=()=>{video.pause();canvas.width=video.videoWidth;canvas.height=video.videoHeight;frameTime=Math.round(video.currentTime*1000)/1000;const requested=Number($('time').value);if(Math.abs(frameTime-requested)<.1)frameTime=requested;else $('time').value=frameTime;const clip=data.clips.find(c=>c.id===file.name.replace(/\.[^.]+$/,''));boxes=structuredClone(clip?.frames.find(f=>f.time===frameTime)?.faces??[]);draw();status(`Frame ${frameTime}s · ${boxes.length} boxes`);};
video.onplay=()=>{frameTime=null;status('Pause and load a frame before labelling.');};
function point(e){const r=canvas.getBoundingClientRect();return {x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))};}
canvas.onpointerdown=e=>{if(frameTime===null)return;start=point(e);canvas.setPointerCapture(e.pointerId);};
canvas.onpointerup=e=>{if(!start)return;const end=point(e),box={x:Math.min(start.x,end.x),y:Math.min(start.y,end.y),width:Math.abs(end.x-start.x),height:Math.abs(end.y-start.y)};start=null;if(box.width>.002&&box.height>.002)boxes.push({label:$('identity').value,box});draw();};
$('undo').onclick=()=>{boxes.pop();draw();};
$('save').onclick=()=>{if(!file||frameTime===null)return status('Load a frame first.');const session=$('session').value.trim(),split=$('split').value,id=file.name.replace(/\.[^.]+$/,'');if(!session)return status('Session is required.');if(data.clips.some(c=>c.session===session&&c.split!==split))return status('Session leakage: this session already belongs to another split.');let clip=data.clips.find(c=>c.id===id);if(clip&&(clip.session!==session||clip.split!==split))return status('Clip already belongs to another session/split.');if(!clip){clip={id,path:file.name,session,split,frames:[]};data.clips.push(clip);}clip.frames=clip.frames.filter(f=>f.time!==frameTime);clip.frames.push({time:frameTime,faces:structuredClone(boxes)});clip.frames.sort((a,b)=>a.time-b.time);status(`Saved ${boxes.length} faces at ${frameTime}s · ${clip.frames.length} frames in clip. Save manifest to keep changes.`);};
$('export').onclick=()=>{const href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=href;a.download='manifest.json';a.click();setTimeout(()=>URL.revokeObjectURL(href),10000);};
</script></html>
